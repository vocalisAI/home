<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preload" href="%PUBLIC_URL%/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Inter, self-hosted: one variable file covers every weight, with no third-party round trip. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Arial scaled to Inter's metrics, so text does not reflow when the real font arrives. */
      @font-face {
        font-family: "Inter Fallback";
        src: local("Arial");
        size-adjust: 107.4%;
        ascent-override: 90.2%;
        descent-override: 22.5%;
        line-gap-override: 0%;
      }
    </style>
    <meta name="theme-color" content="#FCFEFC" />
    <title>Vocalis</title>
    <noscript>
      <style>.menu-toggle,.contact__form,.loi,.js-only { display: none !important; }</style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="container section">To book a demo, request a letter of intent, or get accessibility assistance, email <a href="mailto:meetvocalis@gmail.com">meetvocalis@gmail.com</a>.</p>
    </noscript>
  </body>
</html>
