<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preload" href="%PUBLIC_URL%/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Inter, self-hosted: one variable file covers every weight, with no third-party round trip. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("%PUBLIC_URL%/fonts/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Arial scaled to Inter's metrics, so text does not reflow when the real font arrives. */
      @font-face {
        font-family: "Inter Fallback";
        src: local("Arial");
        size-adjust: 107.4%;
        ascent-override: 90.2%;
        descent-override: 22.5%;
        line-gap-override: 0%;
      }
      /* The static homepage shell below is only for "/". Other routes never paint it. */
      .no-shell #shell { display: none; }
    </style>
    <script>if (location.pathname !== "/") document.documentElement.className += " no-shell";</script>
    <meta name="theme-color" content="#FCFEFC" />
    <title>Vocalis</title>
    <meta
      name="description"
      content="Vocalis is an AI receptionist for independent clinics. It answers every call, books appointments, and shows your team why patients keep calling back."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.vocalis.cc/" />
    <meta property="og:title" content="Vocalis — AI receptionist for independent clinics" />
    <meta property="og:description" content="Answers every call, books appointments, and shows your team why patients keep calling back." />
    <meta property="og:image" content="https://www.vocalis.cc/social-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vocalis — AI receptionist for independent clinics" />
    <meta name="twitter:description" content="Answers every call, books appointments, and shows your team why patients keep calling back." />
    <meta name="twitter:image" content="https://www.vocalis.cc/social-image.png" />
  </head>
  <body>
    <noscript>Vocalis needs JavaScript enabled to show this page. You can reach us at meetvocalis@gmail.com.</noscript>
    <div id="root">
      <!-- Static homepage shell. Same classes as <Hero />, painted by the blocking stylesheet before any
           JavaScript runs, so the headline and the call to action never wait on React.
           React replaces it on mount. A test keeps this copy in step with src/components/home/Hero.jsx. -->
      <div id="shell">
        <header class="site-header">
          <div class="container site-header__bar">
            <a href="/" class="brand" aria-label="Vocalis home"><img src="%PUBLIC_URL%/brand/vocalis-mark-256.png" alt="" width="38" height="34" />Vocalis</a>
            <a class="btn btn--primary btn--sm site-header__cta" href="/#contact">Book a demo</a>
          </div>
        </header>
        <main id="main">
          <section class="hero" aria-labelledby="hero-title">
            <div class="hero__aura" aria-hidden="true"><span class="hero__ring"></span><span class="hero__ring hero__ring--inner"></span></div>
            <div class="container hero__inner">
              <p class="hero__eyebrow">AI Receptionist for Independent Clinics</p>
              <h1 id="hero-title" class="hero__title">Your Front Desk<br />Has Enough to Do.</h1>
              <p class="hero__lead">Vocalis picks up every call, books the visit, and flags what keeps patients calling back, so your staff can look after the people standing at the desk.</p>
              <div class="hero__actions">
                <a href="/#contact" class="btn btn--primary">Book a demo</a>
                <a href="%PUBLIC_URL%/media/vocalis-overview.mp4" class="btn btn--glass"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"></path></svg> See it live</a>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
